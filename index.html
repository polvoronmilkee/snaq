<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-board">
            <h1>Math Snake Game</h1>
            
            <!-- HUD -->
            <div class="hud">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="lives">Lives: <span id="lives">3</span></div>
                <div class="correct">Correct: <span id="correct">0</span>/10</div>
            </div>

            <!-- Question -->
            <div class="question-section">
                <div class="question" id="question">Loading...</div>
                <div class="instruction">Eat the apple with the correct answer!</div>
            </div>

            <!-- Game Canvas -->
            <div class="canvas-container">
                <canvas id="gameCanvas" width="600" height="400"></canvas>
                
                <!-- Game Over Overlay -->
                <div class="game-over-overlay" id="gameOverlay" style="display: none;">
                    <div class="game-over-content">
                        <h2 id="gameOverTitle">Game Over</h2>
                        <p id="finalScore">Final Score: 0</p>
                        <button id="playAgainBtn">Play Again</button>
                    </div>
                </div>
            </div>

            <!-- Instructions -->
            <div class="instructions">
                <p>Use arrow keys to move • Eat correct answers to grow • Avoid wrong answers!</p>
                <p>All apples are red - look at the numbers to find the correct answer!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
