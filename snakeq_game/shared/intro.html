<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Video</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    
    .skip-button {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      border: 2px solid #000;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 16px;
      font-family: 'Press Start 2P', cursive;
      cursor: pointer;
      z-index: 1000;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    
    .skip-button:hover {
      background: #000;
      color: #fff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="myVideo" autoplay muted playsinline>
      <source src="../assets/storyBoard/storyBoard.mp4" type="video/mp4">
    </video>
    <button id="skipButton" class="skip-button hidden">Skip Intro</button>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const video = document.getElementById('myVideo');
      const skipButton = document.getElementById('skipButton');
      const urlParams = new URLSearchParams(window.location.search);
      const isUnskippable = urlParams.get('unskippable') === 'true';
      
      // Show skip button only if not unskippable
      if (!isUnskippable) {
        skipButton.classList.remove('hidden');
      }
      
      // Handle skip button click
      skipButton.addEventListener('click', function() {
        // Set a flag to indicate we've seen the storyboard
        localStorage.setItem('hasSeenIntro', 'true');
        // Go back to index without incrementing the counter
        window.location.href = '../index.html?fromIntro=true';
      });
      
      // Handle video end
      video.addEventListener('ended', function() {
        // Set flags to indicate we've seen the intro
        localStorage.setItem('hasSeenIntro', 'true');
        localStorage.setItem('hasSeenStoryboard', 'true');
        // Go back to index without incrementing the counter
        window.location.href = '../index.html?fromIntro=true';
      });
      
      // Try to play video (in case autoplay is blocked)
      video.play().catch(error => {
        console.log("Autoplay prevented:", error);
      });
    });
  </script>
  Your browser does not support the video tag.
</body>
</html>
