<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .skip-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: 2px solid #000;
            border-radius: 0;
            /* pixel edges */
            padding: 10px 20px;
            font-size: 12px;
            font-family: 'Press Start 2P', monospace !important;
            /* force pixel font */
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px #000;
            /* retro pixel shadow */
            text-transform: uppercase;
        }

        .skip-button:hover {
            background: #000;
            color: #fff;
            transform: translate(-2px, -2px);
            /* instead of smooth scale */
        }

        .skip-button.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <video id="myVideo" autoplay muted playsinline>
            <source src="../assets/storyBoard/storyBoard.mp4" type="video/mp4">
        </video>
        <button id="skipButton" class="skip-button hidden">Skip</button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const video = document.getElementById('myVideo');
            const skipButton = document.getElementById('skipButton');

            // Use let instead of const (so we can update it later if needed)
            let hasSeenIntro = localStorage.getItem('hasSeenIntro') === 'true';

            // Show skip button only if user has already seen the intro
            if (hasSeenIntro) {
                skipButton.classList.remove('hidden');
            }

            // Handle skip button click
            skipButton.addEventListener('click', function () {
                localStorage.setItem('hasSeenIntro', 'true');
                window.location.href = '../index.html?fromIntro=true';
            });

            // Handle video end
            video.addEventListener('ended', function () {
                localStorage.setItem('hasSeenIntro', 'true');
                localStorage.setItem('hasSeenStoryboard', 'true');
                hasSeenIntro = true; // update in case we check it again later
                window.location.href = '../index.html?fromIntro=true';
            });

            // Try to play video (in case autoplay is blocked)
            video.play().catch(error => {
                console.log("Autoplay prevented:", error);
            });
        });
    </script>
    Your browser does not support the video tag.
</body>

</html>
