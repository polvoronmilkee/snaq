<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnAQ - Quiz Your Brain, Grow Your Snake!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="landing-container">
        <!-- Background jungle scene -->
        <div class="jungle-background">
            <div class="trees"></div>
            <div class="grass"></div>
        </div>
        
        <!-- Main content -->
        <div class="main-content">
            <!-- Header with logo and tagline -->
            <header class="game-header">
                <h1 class="logo">
                    <span class="sn">Sn</span><span class="aq">AQ</span>
                </h1>
                <p class="tagline">Quiz your brain, Grow Your Snake!</p>
            </header>

            <!-- Category selection -->
            <div class="category-section">
                <div class="wooden-sign">
                    <h2>Choose a category</h2>
                </div>
                
                <div class="category-buttons">
                    <button class="category-btn math-btn" data-category="math">
                        <span>Mathematics</span>
                    </button>
                    <button class="category-btn english-btn" data-category="english">
                        <span>English</span>
                    </button>
                </div>
                
                <p class="coming-soon">... more subjects coming soon!</p>
                
                <button class="play-btn" id="playBtn" disabled>
                    <span>PLAY</span>
                </button>
            </div>
        </div>

        <!-- Snake character -->
        <div class="snake-character">
            <div class="snake-head"></div>
            <div class="snake-body"></div>
        </div>
    </div>

    <!-- Game Mode Modal -->
    <div id="gameModeModal" class="modal hidden">
        <div class="modal-content">
            <h3>Game Settings</h3>
            
            <div class="setting-group">
                <h4>Game Mode</h4>
                <div class="mode-buttons">
                    <button class="mode-btn" data-mode="quiz">Quiz Mode</button>
                    <button class="mode-btn" data-mode="endless">Endless Mode</button>
                    <button class="mode-btn" data-mode="timed">Timed (1 min)</button>
                </div>
            </div>
            
            <div class="setting-group">
                <h4>Difficulty Level</h4>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                    <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                    <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                </div>
            </div>
            
            <div class="modal-actions">
                <button id="startGameBtn" class="start-btn" disabled>Start Game</button>
                <button id="cancelBtn" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="landing.js"></script>
</body>
</html>
